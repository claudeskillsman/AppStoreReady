name: Wrong finding
description: A finding that is incorrect for your project (false positive) or a problem AppStoreReady missed.
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: ASR014
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Paste the finding from the report. Remove any secrets.
    validations:
      required: true
  - type: textarea
    id: why-wrong
    attributes:
      label: Why it is wrong
      description: What is actually in your project, and a minimal example if you can share one (Info.plist snippet, build settings, code).
    validations:
      required: true
